
name: Android signed release

on:
  push:
    tags:
      - v1.1.1
  workflow_dispatch:
    inputs:
      tag:
        description: New release tag
        required: true
        default: v1.1.1
        type: string
      source_ref:
        description: Branch or commit containing the release source
        required: true
        default: main
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || inputs.tag || github.ref }}

      - name: Validate release version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          APP_VERSION="$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '\r')"
          if [ "$RELEASE_TAG" != "v1.1.1" ] || [ "$APP_VERSION" != "1.1.1+8" ]; then
            echo "::error::Expected tag v1.1.1 and pubspec version 1.1.1+8."
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists."
            exit 1
          fi

      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.PAYDAY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PAYDAY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PAYDAY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PAYDAY_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Configure all PAYDAY Android signing secrets."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter tests and analysis
        run: |
          flutter test
          flutter analyze --no-fatal-infos

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PAYDAY_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/payday-release.jks"
          test -s "$RUNNER_TEMP/payday-release.jks"

      - name: Verify signing key
        env:
          PAYDAY_KEYSTORE_PATH: ${{ runner.temp }}/payday-release.jks
          PAYDAY_KEYSTORE_PASSWORD: ${{ secrets.PAYDAY_KEYSTORE_PASSWORD }}
          PAYDAY_KEY_ALIAS: ${{ secrets.PAYDAY_KEY_ALIAS }}
          PAYDAY_KEY_PASSWORD: ${{ secrets.PAYDAY_KEY_PASSWORD }}
        run: |
          keytool -list \
            -keystore "$PAYDAY_KEYSTORE_PATH" \
            -storepass "$PAYDAY_KEYSTORE_PASSWORD" \
            -alias "$PAYDAY_KEY_ALIAS" >/dev/null
          if ! keytool -certreq \
            -keystore "$PAYDAY_KEYSTORE_PATH" \
            -storepass "$PAYDAY_KEYSTORE_PASSWORD" \
            -keypass "$PAYDAY_KEY_PASSWORD" \
            -alias "$PAYDAY_KEY_ALIAS" \
            -file "$RUNNER_TEMP/signing-key-validation.csr" \
            -noprompt >/dev/null 2>&1; then
            echo "::error::The keystore, key alias, or private-key password does not match. Recheck the four PAYDAY signing secrets in GitHub Actions settings."
            exit 1
          fi

      - name: Build signed APK
        env:
          PAYDAY_KEYSTORE_PATH: ${{ runner.temp }}/payday-release.jks
          PAYDAY_KEYSTORE_PASSWORD: ${{ secrets.PAYDAY_KEYSTORE_PASSWORD }}
          PAYDAY_KEY_ALIAS: ${{ secrets.PAYDAY_KEY_ALIAS }}
          PAYDAY_KEY_PASSWORD: ${{ secrets.PAYDAY_KEY_PASSWORD }}
          UPDATE_REPOSITORY: ${{ github.repository }}
        run: |
          flutter build apk --release --dart-define=UPDATE_REPOSITORY="$UPDATE_REPOSITORY"

      - name: Verify signature continuity
        run: |
          EXPECTED_CERT="f333ea34b4c83c276e36cec926faeaa57567390832552021aa01472722870db9"
          NEW_APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$NEW_APK"
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt"
          NEW_CERT="$("$APKSIGNER" verify --print-certs "$NEW_APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1)"
          if [ -z "$NEW_CERT" ] || [ "$EXPECTED_CERT" != "$NEW_CERT" ]; then
            echo "::error::The new APK signing certificate differs from the established PayDay signing certificate."
            exit 1
          fi
          NEW_CODE="$("$AAPT" dump badging "$NEW_APK" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n 1)"
          APP_VERSION="$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '\r')"
          EXPECTED_CODE="${APP_VERSION##*+}"
          if [ -z "$NEW_CODE" ] || [ "$NEW_CODE" != "$EXPECTED_CODE" ]; then
            echo "::error::The APK version code does not match the pubspec build number."
            exit 1
          fi

      - name: Prepare release assets
        run: |
          APK_NAME="app-release.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/$APK_NAME"
          cd "$RUNNER_TEMP"
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"

      - name: Create new GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          SOURCE_REF: ${{ inputs.source_ref || github.sha }}
        run: |
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/app-release.apk" \
            "$RUNNER_TEMP/app-release.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_REF" \
            --title "PayDay ${RELEASE_TAG}" \
            --generate-notes
