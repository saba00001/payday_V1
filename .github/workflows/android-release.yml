name: Android signed release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (for example v1.0.1)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.PAYDAY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PAYDAY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PAYDAY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PAYDAY_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || \
             [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Configure all PAYDAY Android signing secrets before publishing a release."
            exit 1
          fi

      - name: Validate release tag against pubspec
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          APP_VERSION="$(sed -n 's/^version: *\([^+]*\)+.*/\1/p' pubspec.yaml)"
          TAG_VERSION="${RELEASE_TAG#v}"
          if [ -z "$APP_VERSION" ] || [ "$APP_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Release tag ($TAG_VERSION) must match pubspec version ($APP_VERSION)."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PAYDAY_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/payday-release.jks"
          test -s "$RUNNER_TEMP/payday-release.jks"

      - name: Build signed universal APK
        env:
          PAYDAY_KEYSTORE_PATH: ${{ runner.temp }}/payday-release.jks
          PAYDAY_KEYSTORE_PASSWORD: ${{ secrets.PAYDAY_KEYSTORE_PASSWORD }}
          PAYDAY_KEY_ALIAS: ${{ secrets.PAYDAY_KEY_ALIAS }}
          PAYDAY_KEY_PASSWORD: ${{ secrets.PAYDAY_KEY_PASSWORD }}
          UPDATE_REPOSITORY: ${{ github.repository }}
        run: |
          flutter build apk --release \
            --dart-define=UPDATE_REPOSITORY="$UPDATE_REPOSITORY"

      - name: Create release checksum
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/PayDay-${RELEASE_TAG}.apk"
          cd "$RUNNER_TEMP"
          sha256sum "PayDay-${RELEASE_TAG}.apk" > "PayDay-${RELEASE_TAG}.apk.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/PayDay-${RELEASE_TAG}.apk" \
            "$RUNNER_TEMP/PayDay-${RELEASE_TAG}.apk.sha256" \
            --title "PayDay $RELEASE_TAG" \
            --generate-notes
